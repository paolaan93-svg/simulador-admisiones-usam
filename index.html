  <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Evaluación - Admisiones USAM</title>
  <style>
    :root { --primary: #003366; --secondary: #008080; --bg: #f4f7f6; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; }
    .container { max-width: 750px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h1 { color: var(--primary); text-align: center; margin-bottom: 5px; }
    p.subtitle { text-align: center; color: #666; margin-bottom: 25px; }
    .btn { background: var(--primary); color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; transition: 0.3s; }
    .btn:hover { background: #002244; }
    .option-btn { background: #eef2f5; color: #333; text-align: left; margin: 8px 0; border: 1px solid #ccc; font-size: 15px; }
    .option-btn:hover { background: #dce4ec; }
    .feedback { margin-top: 15px; padding: 12px; border-radius: 6px; display: none; font-size: 14px; }
    .feedback.correct { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .feedback.incorrect { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .hidden { display: none; }
    .progress { height: 10px; background: #e0e0e0; border-radius: 5px; margin-bottom: 20px; overflow: hidden; }
    .progress-bar { height: 100%; background: var(--secondary); width: 0%; transition: width 0.3s; }
  </style>
</head>
<body>
  <div class="container">
    <div id="start-screen">
      <h1>Evaluación de Conocimientos - Admisiones USAM</h1>
      <p class="subtitle">Demuestra tu conocimiento en requisitos, aranceles, nivelatorios y normativas académicas.</p>
      <button class="btn" onclick="startQuiz()">Iniciar Evaluación</button>
    </div>

    <div id="quiz-screen" class="hidden">
      <div class="progress"><div id="progress-bar" class="progress-bar"></div></div>
      <h3 id="question-title"></h3>
      <div id="options-container"></div>
      <div id="feedback" class="feedback"></div>
      <button id="next-btn" class="btn hidden" style="margin-top:15px;" onclick="nextQuestion()">Siguiente Pregunta</button>
    </div>

    <div id="result-screen" class="hidden" style="text-align: center;">
      <h2>Resultado de la Evaluación</h2>
      <p id="score-text" style="font-size: 20px; font-weight: bold;"></p>
      <p id="feedback-summary"></p>
      <button class="btn" onclick="location.reload()">Reiniciar Evaluador</button>
    </div>
  </div>
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
