<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego de Escaleras - Admisiones & Cultura General</title>
  <style>
    :root {
      --primary: #003366;
      --secondary: #008080;
      --accent: #ff9900;
      --bg: #1e1e2f;
      --card-bg: #ffffff;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: #fff;
      margin: 0;
      padding: 15px;
    }
    .main-layout {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
      justify-content: center;
    }
    .board-container {
      flex: 1 1 500px;
      max-width: 600px;
      background: #2a2a40;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .board {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 6px;
      aspect-ratio: 1 / 1;
    }
    .cell {
      background: #3a3a55;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 6px;
      position: relative;
      font-weight: bold;
      font-size: 14px;
      box-sizing: border-box;
    }
    .cell-num { position: absolute; top: 4px; left: 6px; font-size: 11px; opacity: 0.7; }
    .cell.ladder { background: #1b4332; border: 2px dashed #52b788; }
    .cell.snake { background: #49111c; border: 2px dashed #f72585; }
    .cell.start { background: #0077b6; }
    .cell.finish { background: #ffb703; color: #000; font-weight: 900; }
    .token {
      width: 28px;
      height: 28px;
      background: #ff4757;
      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 10px #ff4757;
      transition: all 0.4s ease;
      margin-top: auto;
    }
    .control-panel {
      flex: 1 1 400px;
      max-width: 550px;
      background: var(--card-bg);
      color: #222;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
    }
    h1 { color: var(--primary); margin-top: 0; text-align: center; font-size: 24px; }
    .status-box {
      background: #eef2f7;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
    }
    .dice-area { text-align: center; margin: 15px 0; }
    .dice-btn {
      background: #ff6b6b;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255,107,107,0.4);
      transition: 0.2s;
    }
    .dice-btn:hover { background: #ee5253; transform: scale(1.03); }
    .dice-result { font-size: 32px; font-weight: bold; margin-top: 8px; color: var(--primary); min-height: 40px; }
    .question-card {
      background: #f8f9fa;
      border-left: 5px solid var(--secondary);
      padding: 15px;
      border-radius: 6px;
      margin-top: 10px;
    }
    .opt-btn {
      width: 100%;
      text-align: left;
      background: #fff;
      border: 1px solid #ccd1d9;
      padding: 10px 14px;
      margin: 6px 0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }
    .opt-btn:hover { background: #e6f0fa; border-color: var(--primary); }
    .feedback {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }
    .feedback.correct { background: #d4edda; color: #155724; }
    .feedback.wrong { background: #f8d7da; color: #721c24; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="main-layout">
    <!-- TABLERO VISUAL DE 30 CASILLAS -->
    <div class="board-container">
      <div class="board" id="board"></div>
    </div>

    <!-- PANEL DE CONTROL Y PREGUNTAS -->
    <div class="control-panel">
      <h1>🧗 Escalera de Admisiones USAM</h1>
      
      <div class="status-box">
        <span>Posición Actual: Casilla <span id="pos-display">1</span></span>
        <span>Aciertos: <span id="score-display">0</span></span>
      </div>

      <div class="dice-area" id="dice-area">
        <button class="dice-btn" onclick="rollDice()">🎲 Lanzar Dado</button>
        <div class="dice-result" id="dice-result"></div>
      </div>

      <div class="question-card hidden" id="question-card">
        <h4 id="q-title" style="margin-top:0; color:#003366;"></h4>
        <div id="opts-container"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-btn" class="dice-btn hidden" style="width:100%; margin-top:10px; font-size:15px; padding:10px;" onclick="continueGame()">Continuar Avanzando ➡️</button>
      </div>

      <div class="question-card hidden" id="victory-card" style="text-align:center;">
        <h2 style="color:#2ed573;">🎉 ¡Felicidades! Llegaste a la Meta</h2>
        <p id="final-stats"></p>
        <button class="dice-btn" onclick="location.reload()">🎮 Jugar Otra Vez</button>
      </div>
    </div>
  </div>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
