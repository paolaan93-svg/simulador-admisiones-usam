<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gran Escalera USAM - Multiequipos (40 Casillas)</title>
  <style>
    :root {
      --primary: #003366;
      --secondary: #008080;
      --accent: #ff9900;
      --bg: #181824;
      --card-bg: #ffffff;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: #fff;
      margin: 0;
      padding: 15px;
    }
    .main-layout {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      max-width: 1350px;
      margin: 0 auto;
      justify-content: center;
    }
    .board-container {
      flex: 1 1 650px;
      max-width: 780px;
      background: #232334;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(5, 1fr);
      gap: 6px;
      aspect-ratio: 8 / 5;
    }
    .cell {
      background: #323248;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 3px;
      position: relative;
      font-weight: bold;
      font-size: 12px;
      box-sizing: border-box;
      text-align: center;
    }
    .cell-num { position: absolute; top: 2px; left: 4px; font-size: 10px; opacity: 0.7; }
    .cell.ladder { background: #1b4332; border: 2px dashed #52b788; }
    .cell.snake { background: #49111c; border: 2px dashed #f72585; }
    .cell.penalty { background: #5c3d11; border: 2px dashed #ffb703; }
    .cell.start { background: #0077b6; }
    .cell.finish { background: #ffb703; color: #000; font-weight: 900; }
    
    .tokens-container {
      display: flex;
      gap: 3px;
      justify-content: center;
      align-items: center;
      margin-top: auto;
      min-height: 22px;
    }
    .token {
      width: 18px;
      height: 18px;
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(0,0,0,0.6);
      transition: all 0.3s ease;
    }
    .token.red { background: #ff4757; }
    .token.blue { background: #1e90ff; }
    .token.green { background: #2ed573; }

    .control-panel {
      flex: 1 1 400px;
      max-width: 500px;
      background: var(--card-bg);
      color: #222;
      padding: 22px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
    }
    h1 { color: var(--primary); margin-top: 0; text-align: center; font-size: 22px; }
    
    .team-turn-bar {
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      color: white;
      margin-bottom: 12px;
      transition: background 0.3s;
    }
    .scoreboard {
      display: flex;
      justify-content: space-around;
      background: #f1f5f9;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 13px;
      font-weight: 600;
      color: #333;
    }
    .dice-area { text-align: center; margin: 10px 0; }
    .dice-btn {
      background: #ff6b6b;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255,107,107,0.4);
      transition: 0.2s;
    }
    .dice-btn:hover { background: #ee5253; transform: scale(1.02); }
    .dice-result { font-size: 30px; font-weight: bold; margin-top: 6px; color: var(--primary); min-height: 36px; }
    .card-box {
      background: #f8f9fa;
      border-left: 5px solid var(--secondary);
      padding: 15px;
      border-radius: 6px;
      margin-top: 10px;
    }
    .card-box.penalty-mode { border-left-color: #ff9900; background: #fffdf5; }
    .opt-btn {
      width: 100%;
      text-align: left;
      background: #fff;
      border: 1px solid #ccd1d9;
      padding: 10px 12px;
      margin: 5px 0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }
    .opt-btn:hover { background: #e6f0fa; border-color: var(--primary); }
    .feedback {
      margin-top: 10px;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }
    .feedback.correct { background: #d4edda; color: #155724; }
    .feedback.wrong { background: #f8f9fa; color: #721c24; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="main-layout">
    <!-- TABLERO VISUAL 40 CASILLAS -->
    <div class="board-container">
      <div class="board" id="board"></div>
    </div>

    <!-- PANEL DE CONTROL MULTIEQUIPO -->
    <div class="control-panel">
      <h1>🧗 Escalera USAM - Multiequipos</h1>
      
      <!-- BARRA DE TURNO DEL EQUIPO -->
      <div id="team-turn-bar" class="team-turn-bar" style="background: #ff4757;">
        Turno de: 🔴 Equipo Rojo
      </div>

      <!-- MARCADOR -->
      <div class="scoreboard">
        <div>🔴 Rojo: C<span id="pos-0">1</span> (<span id="score-0">0</span> pts)</div>
        <div>🔵 Azul: C<span id="pos-1">1</span> (<span id="score-1">0</span> pts)</div>
        <div>🟢 Verde: C<span id="pos-2">1</span> (<span id="score-2">0</span> pts)</div>
      </div>

      <!-- DADO -->
      <div class="dice-area" id="dice-area">
        <button class="dice-btn" onclick="rollDice()">🎲 Lanzar Dado</button>
        <div class="dice-result" id="dice-result"></div>
      </div>

      <!-- PREGUNTA -->
      <div class="card-box hidden" id="question-card">
        <h4 id="q-title" style="margin-top:0; color:#003366;"></h4>
        <div id="opts-container"></div>
        <div id="feedback" class="feedback"></div>
        <button id="next-btn" class="dice-btn hidden" style="width:100%; margin-top:10px; font-size:15px; padding:10px;" onclick="continueGame()">Pasar al Siguiente Turno ➡️</button>
      </div>

      <!-- PENITENCIA DIVERTIDA -->
      <div class="card-box penalty-mode hidden" id="penalty-card">
        <h3 style="margin-top:0; color:#d97706;">🎭 ¡CASILLA DE PENITENCIA!</h3>
        <p id="penalty-text" style="font-size:15px; font-weight:bold; color:#333;"></p>
        <p style="font-size:12px; color:#666;">El equipo debe cumplir el reto en vivo por Teams para poder avanzar en su siguiente turno.</p>
        <button class="dice-btn" style="width:100%; margin-top:10px; font-size:15px; padding:10px; background:#d97706;" onclick="completePenalty()">✅ Penitencia Cumplida</button>
      </div>

      <!-- VICTORIA -->
      <div class="card-box hidden" id="victory-card" style="text-align:center;">
        <h2 style="color:#2ed573;">🎉 ¡TENEMOS EQUIPO GANADOR!</h2>
        <p id="final-stats" style="font-size:16px; font-weight:bold;"></p>
        <button class="dice-btn" onclick="location.reload()">🎮 Volver a Jugar</button>
      </div>
    </div>
  </div>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
